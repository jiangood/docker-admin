name: 构建校验

# PR 上跑完整构建，让依赖升级在合并前就被验证。
# 背景：此前仓库无任何 PR 校验，codemirror 5 -> 6 这类破坏性升级可以零阻力合入，
#       直到本地 npm run build 才会失败。
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# 同一分支的新提交会取消仍在排队/运行中的旧任务
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 编译打包
        run: mvn -B clean package -DskipTests

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/app.jar
          retention-days: 7
          if-no-files-found: error

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm install

      - name: 构建
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7
          if-no-files-found: error
