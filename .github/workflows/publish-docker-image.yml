name: 构建并发布 Docker 镜像

on:
  push:
    tags:
      - 'v*'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v7

    - name: 登录到 GitHub Container Registry
      uses: docker/login-action@v4
      if: github.ref_type == 'tag'
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 构建并推送 Docker 镜像
      if: github.ref_type == 'tag'
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/docker-admin:latest
          ghcr.io/${{ github.repository_owner }}/docker-admin:${{ github.ref_name }}

    - name: 创建 Release
      if: github.ref_type == 'tag'
      uses: softprops/action-gh-release@v3
      with:
        name: ${{ github.ref_name }}
        body: |
          ## ${{ github.ref_name }}

          ### Docker 镜像

          ```sh
          docker pull ghcr.io/${{ github.repository_owner }}/docker-admin:${{ github.ref_name }}
          ```

          ### 快速体验（无需外部数据库）

          内置 H2 数据库，数据持久化到 `./data`，开箱即用：

          ```sh
          docker run -d --name docker-admin \
            -p 7001:7001 \
            -e SERVER_PORT=7001 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ./data:/data \
            ghcr.io/${{ github.repository_owner }}/docker-admin:${{ github.ref_name }}
          ```

          或使用 docker compose：

          ```sh
          curl -O https://raw.githubusercontent.com/${{ github.repository_owner }}/docker-admin/main/docker-compose/docker-compose.yml
          docker compose up -d
          ```

          ### docker-compose.yml

          ```yaml
          services:
            admin:
              image: ghcr.io/${{ github.repository_owner }}/docker-admin:${{ github.ref_name }}
              ports:
                - "7001:7001"
              environment:
                - SERVER_PORT=7001
              volumes:
                - "/var/run/docker.sock:/var/run/docker.sock"
                - "./data/:/data"
              restart: unless-stopped
          ```

          ### 访问

          http://127.0.0.1:7001/docker-admin

          默认账号：`admin`，密码：`Open@1234`（首次登录后请及时修改）。
        token: ${{ secrets.GITHUB_TOKEN }}

