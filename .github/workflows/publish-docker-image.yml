name: 构建并发布 Docker 镜像

on:
  push:
    tags:
      - 'v*'

jobs:
  # 两个镜像仓库并行推送：matrix 的每个元素是一个独立 job，
  # 互不阻塞。fail-fast: false 保证其中一个失败时另一个仍能推完。
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GitHub Container Registry
            registry: ghcr.io
            image: ghcr.io/${{ github.repository_owner }}/docker-admin
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
          - name: 阿里云容器镜像服务
            registry: registry.cn-hangzhou.aliyuncs.com
            image: registry.cn-hangzhou.aliyuncs.com/jiangood/docker-admin
            username: hustme
            password: ${{ secrets.ALIYUN_PASSWORD }}

    name: 构建并推送 (${{ matrix.name }})
    steps:
    - name: 检出代码
      uses: actions/checkout@v7

    - name: 登录到 ${{ matrix.registry }}
      uses: docker/login-action@v4
      with:
        registry: ${{ matrix.registry }}
        username: ${{ matrix.username }}
        password: ${{ matrix.password }}

    - name: 构建并推送 Docker 镜像
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: |
          ${{ matrix.image }}:latest
          ${{ matrix.image }}:${{ github.ref_name }}

  # 所有镜像仓库推送成功后，才创建 Release
  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: 检出代码
      uses: actions/checkout@v7

    - name: 创建 Release
      uses: softprops/action-gh-release@v3
      with:
        name: ${{ github.ref_name }}
        body: |
          ## ${{ github.ref_name }}

          ### Docker 镜像

          ```sh
          # GitHub Container Registry
          docker pull ghcr.io/${{ github.repository_owner }}/docker-admin:${{ github.ref_name }}

          # 阿里云容器镜像服务
          docker pull registry.cn-hangzhou.aliyuncs.com/jiangood/docker-admin:${{ github.ref_name }}
          ```

          ### 快速体验（无需外部数据库）

          内置 H2 数据库，数据持久化到 `./data`，开箱即用：

          ```sh
          docker run -d --name docker-admin \
            -p 7001:7001 \
            -e SERVER_PORT=7001 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ./data:/data \
            ghcr.io/${{ github.repository_owner }}/docker-admin:${{ github.ref_name }}
          ```

          或使用 docker compose：

          ```sh
          curl -O https://raw.githubusercontent.com/${{ github.repository_owner }}/docker-admin/main/docker-compose.yml
          docker compose up -d
          ```

          ### docker-compose.yml

          ```yaml
          services:
            admin:
              image: ghcr.io/${{ github.repository_owner }}/docker-admin:${{ github.ref_name }}
              ports:
                - "7001:7001"
              environment:
                - SERVER_PORT=7001
              volumes:
                - "/var/run/docker.sock:/var/run/docker.sock"
                - "./data/:/data"
              restart: unless-stopped
          ```

          ### 访问

          http://127.0.0.1:7001

          默认账号：`admin`，密码：`Open@1234`（首次登录后请及时修改）。
        token: ${{ secrets.GITHUB_TOKEN }}
