name: 构建并发布 Docker 镜像

on:
  push:
    tags:
      - 'v*'

env:
  # buildx 默认会把构建记录(.dockerbuild)作为 artifact 上传,纯发布用不到
  DOCKER_BUILD_SUMMARY: false
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v7

    - name: 登录到 GitHub Container Registry
      uses: docker/login-action@v4
      if: github.ref_type == 'tag'
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 登录到阿里云容器镜像服务
      uses: docker/login-action@v4
      if: github.ref_type == 'tag'
      with:
        registry: registry.cn-hangzhou.aliyuncs.com
        username: hustme
        password: ${{ secrets.ALIYUN_PASSWORD }}

    - name: 构建并推送 Docker 镜像
      if: github.ref_type == 'tag'
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/docker-admin:latest
          ghcr.io/${{ github.repository_owner }}/docker-admin:${{ github.ref_name }}
          registry.cn-hangzhou.aliyuncs.com/jiangood/docker-admin:latest
          registry.cn-hangzhou.aliyuncs.com/jiangood/docker-admin:${{ github.ref_name }}

    - name: 构建并推送主机 agent 镜像
      if: github.ref_type == 'tag'
      uses: docker/build-push-action@v7
      with:
        context: ./agent
        push: true
        # 把发布 tag 写进镜像：OCI label + ENV + /etc/docker-admin-agent-release，
        # 平台据此展示 agent 版本，并按「agent 与平台同 tag 发版」提示是否可更新
        build-args: |
          AGENT_VERSION=${{ github.ref_name }}
        tags: |
          ghcr.io/${{ github.repository_owner }}/docker-admin-agent:latest
          ghcr.io/${{ github.repository_owner }}/docker-admin-agent:${{ github.ref_name }}
          registry.cn-hangzhou.aliyuncs.com/jiangood/docker-admin-agent:latest
          registry.cn-hangzhou.aliyuncs.com/jiangood/docker-admin-agent:${{ github.ref_name }}

    - name: 创建 Release
      if: github.ref_type == 'tag'
      uses: softprops/action-gh-release@v3
      with:
        name: ${{ github.ref_name }}
        # 正文由上一次 release 到本次 tag 之间的 commit / PR 自动生成
        generate_release_notes: true
        token: ${{ secrets.GITHUB_TOKEN }}

