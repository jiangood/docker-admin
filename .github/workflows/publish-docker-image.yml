name: 构建并发布 Docker 镜像

on:
  push:
    tags:
      - 'v*'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    - name: 设置 JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: 设置 Node.js 18
      uses: actions/setup-node@v3
      with:
        node-version: 18
        registry-url: https://registry.npmjs.org

    - name: 登录到 GitHub Container Registry
      uses: docker/login-action@v3
      if: github.ref_type == 'tag'
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 构建并推送 Docker 镜像
      if: github.ref_type == 'tag'
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/docker-admin:latest
          ghcr.io/${{ github.repository_owner }}/docker-admin:${{ github.ref_name }}

    - name: 创建 Release
      if: github.ref_type == 'tag'
      uses: softprops/action-gh-release@v2
      with:
        name: ${{ github.ref_name }}
        body: |
          ## ${{ github.ref_name }}

          ### Docker 镜像

          ```sh
          docker pull ghcr.io/${{ github.repository_owner }}/docker-admin:${{ github.ref_name }}
          ```

          ### 快速体验

          ```sh
          curl -O https://raw.githubusercontent.com/${{ github.repository_owner }}/docker-admin/main/docker-compose/docker-compose.yml
          curl -O https://raw.githubusercontent.com/${{ github.repository_owner }}/docker-admin/main/docker-compose/application-prod.yml
          # 修改 application-prod.yml 中的数据库配置后启动
          docker compose up -d
          ```

          ### docker-compose.yml

          ```yaml
          services:
            admin:
              image: ghcr.io/${{ github.repository_owner }}/docker-admin:${{ github.ref_name }}
              ports:
                - "7001:7001"
              volumes:
                - "/var/run/docker.sock:/var/run/docker.sock"
                - "./data/:/data"
                - "./application-prod.yml:/home/application.yml"
          ```

          ### 访问

          http://127.0.0.1:7001/docker-admin

          默认账号：`superAdmin`，密码打印在容器日志中。
        token: ${{ secrets.GITHUB_TOKEN }}

