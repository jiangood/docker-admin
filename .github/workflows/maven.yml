name: Jar

on:
  push:
    tags:
      - 'v*'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - uses: actions/setup-node@v3
      with:
        node-version: 18
        registry-url: https://registry.npmjs.org

    - name: 前端构建
      run: cd web && npm install && npm run build

    - name: 复制前端文件到后端源码的静态文件夹
      run: cp -r web/dist/* src/main/resources/static

    - name: 后端构建
      run: mvn package

    - name: 上传jar包到GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.ref_type == 'tag'
      with:
        files: target/app.jar

    - name: 登录到 GitHub Container Registry
      uses: docker/login-action@v3
      if: github.ref_type == 'tag'
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 构建并推送 Docker 镜像
      if: github.ref_type == 'tag'
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/docker-admin:latest
          ghcr.io/${{ github.repository_owner }}/docker-admin:${{ github.ref_name }}

