menus:
  - id: project
    name: 项目
    path: /project
    icon: OrderedListOutlined
    perms:
      - {code: project:view, name: 查看}
      - {code: project:save, name: 保存}
      - {code: project:delete, name: 删除}
      - {code: project:build, name: 构建}
  - id: app
    name: 应用
    path: /app
    icon: AppstoreOutlined
    perms:
      - {code: app:view, name: 查看}
      - {code: app:save, name: 保存}
      - {code: app:config, name: 配置}
      - {code: app:delete, name: 删除}
      - {code: app:deploy, name: 部署}
  - id: host
    name: 主机
    path: /host
    icon: DesktopOutlined
    perms:
      - {code: host:list, name: 查看}
      - {code: host:save, name: 保存}
      - {code: host:delete, name: 删除}
