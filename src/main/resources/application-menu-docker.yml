## docker-admin 业务菜单
menus:
  biz:
    name: 容器平台
    icon: AppstoreOutlined
    seq: 10
  project:
    pid: biz
    name: 项目
    path: /project
    icon: ContainerOutlined
    perms:
      - {name: 查看, code: project:view}
      - {name: 保存, code: project:save}
      - {name: 删除, code: project:delete}
      - {name: 构建, code: project:build}
      - {name: Webhook, code: project:webhook}

  app:
    pid: biz
    name: 应用
    path: /app
    icon: AppstoreOutlined
    perms:
      - {name: 查看, code: app:view}
      - {name: 保存, code: app:save}
      - {name: 配置, code: app:config}
      - {name: 删除, code: app:delete}
      - {name: 部署, code: app:deploy}
      - {name: 隧道, code: app:tunnel}
      - {name: 迁移, code: app:migrate}
  divider-app:
    pid: biz
    type: divider
  image-repo:
    pid: biz
    name: 镜像仓库
    path: /image-repo
    icon: DatabaseOutlined
    perms:
      - { name: 查看, code: image-repo:view }
      - { name: 导出, code: image-repo:export }
      - { name: 删除, code: image-repo:delete }
      - { name: 补录, code: image-repo:sync }
  divider-image-repo:
    pid: biz
    type: divider
  setting:
    pid: biz
    name: 设置
    icon: SettingOutlined
  host:
    pid: setting
    name: 主机管理
    path: /host
    icon: DesktopOutlined
    perms:
      - {name: 查看, code: host:list}
      - {name: 保存, code: host:save}
      - {name: 删除, code: host:delete}
      - {name: 容器控制台, code: container:exec}
      - {name: 容器文件, code: container:file}
      - {name: 容器操作, code: container:operate}
      - {name: 镜像操作, code: host:image}
  setting-registry:
    pid: setting
    name: 注册中心
    path: /registry
    icon: CloudServerOutlined
    perms:
      - {name: 查看, code: registry:view}
      - {name: 保存, code: registry:save}
  setting-code-source:
    pid: setting
    name: 代码源
    path: /code-source
    icon: KeyOutlined
    perms:
      - {name: 查看, code: code-source:view}
      - {name: 保存, code: code-source:save}
      - {name: 删除, code: code-source:delete}
  setting-system-config:
    pid: setting
    name: 全局设置
    path: /system-config
    icon: ControlOutlined
    perms:
      - {name: 查看, code: system-config:view}
      - {name: 保存, code: system-config:save}
  tool:
    pid: biz
    name: 辅助工具
    icon: ToolOutlined
  setting-sync:
    pid: tool
    name: 镜像同步
    path: /image-sync
    icon: CloudSyncOutlined
    perms:
      - {name: 查看, code: image-sync:view}
      - {name: 同步, code: image-sync:sync}
  build-test:
    pid: tool
    name: 构建测试
    path: /build-test
    icon: BuildOutlined
    perms:
      - {name: 查看, code: build-test:view}
      - {name: 构建, code: build-test:build}
      - {name: 写入仓库, code: build-test:write}
  tunnel:
    pid: tool
    name: 隧道管理
    path: /tunnel
    icon: ApiOutlined
    perms:
      - {name: 查看, code: tunnel:view}
      - {name: 客户端, code: tunnel:save}
