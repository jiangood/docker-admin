# H2 数据库文件根路径（不含扩展名）。
# 默认写入容器内 /data 目录（docker-compose 已把 ./data 挂载到 /data，数据持久化）。
# 本地开发可通过 -Ddb_path=./data/db/docker-admin 覆盖。
db_path: /data/db/docker-admin

server:
  port: 7001
  servlet:
    context-path: /docker-admin  # 业务项目按需修改
spring:
  config:
    import: classpath:application-lib.yml
  profiles:
    active: default
  application:
    name: docker-admin
  datasource:
    # 内置 H2，MySQL 兼容模式，首次启动自动建表并写入种子数据，无需外部数据库。
    driver-class-name: org.h2.Driver
    url: "jdbc:h2:file:${db_path};MODE=MySQL;DB_CLOSE_DELAY=-1"
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
sys:
  title: 容器管理平台

