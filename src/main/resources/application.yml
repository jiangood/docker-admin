# H2 数据库文件根路径（不含扩展名）。
# 默认写入容器内 /data 目录（docker-compose 已把 ./data 挂载到 /data，数据持久化）。
# 本地开发可通过 -Ddb_path=./data/db/docker-admin 覆盖。
db_path: /data/db/docker-admin

server:
  port: 8601
  servlet:
    context-path: /docker-admin  # 本地开发上下文；容器部署由镜像内置的 SERVER_SERVLET_CONTEXT_PATH=/ 覆盖为根路径
    session:
      cookie:
        # WebSocket 端点不做 Origin 校验（代理/隧道下 Spring 的同源判定必然失败），
        # 跨站防护依赖这里：跨站页面发起的 WebSocket 握手不带 Cookie，因而过不了握手拦截器的鉴权。
        # 不要改成 none。
        same-site: lax
spring:
  config:
    import: classpath:application-lib.yml
  profiles:
    active: default
  application:
    name: docker-admin
  servlet:
    multipart:
      # 镜像 tar 常见数 GB，默认 1MB 会在上传阶段直接失败
      max-file-size: 20GB
      max-request-size: 20GB
  datasource:
    # 内置 H2，MySQL 兼容模式，首次启动自动建表并写入种子数据，无需外部数据库。
    driver-class-name: org.h2.Driver
    url: "jdbc:h2:file:${db_path};MODE=MySQL;DB_CLOSE_DELAY=-1"
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
sys:
  title: 容器管理平台
  # 同一账号最大并发会话数。默认 1（单点登录）；2 表示允许两台设备同时在线，第 3 次登录会顶掉最早的会话。
  maximum-sessions: 2

