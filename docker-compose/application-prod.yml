# 可选配置：挂载到容器 /home/application.yml 后生效（不挂载也可一键启动，数据写入 /data）。
# 默认使用内置 H2 数据库，无需外部 MySQL。

server.port: 7001

# H2 数据库文件路径（容器内 /data 已挂载到宿主机 ./data，数据库随目录持久化）
db_path: /data/db/docker-admin

cfg:
  # 镜像注册中心
  registry:
    url: ghcr.io
    namespace: jiangood
    username: 账号
    password: 密码
  # git仓库
  git-repos:
    - url: https://gitee.com
      username: 账号
      password: 密码
