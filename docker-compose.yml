services:
  admin:
    image: ghcr.io/jiangood/docker-admin:latest
    ports:
      # 宿主机:容器；容器内端口由镜像内置的 SERVER_PORT=7701 决定
      - "7701:7701"
    # 需要覆盖端口、数据库路径等时再加 environment，例如：
    #   - SERVER_PORT=7701
    #   - DB_PATH=/data/db/docker-admin
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      # 数据目录：内置 H2 数据库、上传文件、日志均持久化在此
      - "./data/:/data"
    restart: unless-stopped
